name: Install stats

# Daily snapshot of install signals (release-asset downloads, traffic/clones,
# traffic/views, recent workflow run count) into docs/install-stats.ndjson,
# plus a regenerated docs/INSTALL_STATS.md and README block.
#
# Cron is offset from canary.yml's 09:13 to avoid runner contention.
# `concurrency` guards against overlap if a manual dispatch races the cron.
# Commits use `[skip ci]` so the resulting push doesn't retrigger ci.yml.

on:
  schedule:
    - cron: '17 3 * * *'   # ~03:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write   # to commit + push the regenerated files

concurrency:
  group: install-stats
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot + regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot + report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash script/install-stats.sh

      - name: Commit if changed
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/install-stats.ndjson docs/INSTALL_STATS.md README.md
          if git diff --staged --quiet; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          DATE=$(date -u +%F)
          git commit -m "chore(analytics): snapshot ${DATE} [skip ci]"
          git push origin HEAD:main
